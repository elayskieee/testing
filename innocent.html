<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>My 6 Emotions</title>
    <style>
        body {
            background: radial-gradient(circle, black, black);
            font-family: Arial, sans-serif;
            color: whitesmoke;
            text-align: center;
        }
        header {
            text-align: left;
            margin-bottom: 20px;
            position: relative;
        }
        button {
            position: relative;
            background-color: black;
            color: white;
            padding: 10px 20px;
            border: 1px solid white;
            border-radius: 8px;
            margin: 10px;
            cursor: pointer;
        }
        #turnOffBtn {
            background-color: gray;
            color: white;
            padding: 10px 20px;
            border: 2px solid white;
            border-radius: 8px;
        }

        #turnOnBtn {
            background-color: gray;
            color: white;
            padding: 10px 20px;
            border: 2px solid white;
            border-radius: 8px;
        }       
        button:hover {
            background-color: #f5f5f5;
            border: 1px solid gray;
            color: black;
        }
        #turnOffBtn:hover {
            background-color: black;
            border: 2px solid white;
            color: white;
        }
        #turnOnBtn:hover {
            background-color: white;
            border: 2px solid gray;
            color: black;
        } 
        .container img {
            width: 200px;
            height: 200px;
            object-fit: cover;
            object-position: center;
        }
    </style>
</head>
<header>
    <button onclick="window.location.href='index.html'">Back to Home</button>
</header>
<body>
    <div>
        <button id="turnOffBtn" onclick="document.getElementById('lightbulb').src='lights off.jpg'">Turn Off Light</button>
        <img id="lightbulb" src="lights off.jpg" style="width: 200px; height: auto; margin-top: 20px;">
        <button id="turnOnBtn" onclick="document.getElementById('lightbulb').src='lights on.jpg'">Turn On Light</button>
    </div>
</body>
</html>
